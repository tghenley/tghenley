<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Henley Studio — Marketing Ideas</title>
  <meta name="description" content="A marketing planner for Henley Studio (Brisbane portrait, headshot & personal branding photography). Choose what you're doing now and what you could do next, month by month." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scrim" id="scrim"></div>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">📸</span> Henley Studio</div>
      <button class="nav-item active" data-view="dashboard"><span class="ico">📊</span> Dashboard</button>
      <button class="nav-item" data-view="calendar"><span class="ico">📅</span> By Month</button>
      <button class="nav-item" data-view="library"><span class="ico">💡</span> Idea Library</button>
      <button class="nav-item" data-view="board"><span class="ico">🗂️</span> My Board</button>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot">
        <button class="btn primary" id="addIdeaBtn"><span>＋</span> Add Idea</button>
        <button class="btn ghost sm" id="themeBtn">🌓 Toggle theme</button>
        <button class="btn ghost sm" id="exportBtn">⬇ Export data</button>
        <button class="btn ghost sm" id="importBtn">⬆ Import data</button>
        <button class="btn ghost sm danger" id="resetBtn">↺ Reset all</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <div class="sub" id="viewSub">Your marketing command center</div>
        </div>
        <div class="topbar-spacer"></div>
        <div class="search-box">
          <span class="ico">🔍</span>
          <input type="text" id="searchInput" placeholder="Search ideas, tags…" />
        </div>
      </header>
      <main class="content" id="content"><!-- rendered by app.js --></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="importFile" accept="application/json" style="display:none" />

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
